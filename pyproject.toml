[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getjobs"
version = "1.0.0"
description = "智能求职自动投递工具"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "GetJobs Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "playwright>=1.42",
    "camoufox>=0.3",
]

[project.scripts]
getjobs = "run:main"

[project.urls]
Homepage = "https://github.com/vvvsrx/get_jobs"
Issues = "https://github.com/vvvsrx/get_jobs/issues"
